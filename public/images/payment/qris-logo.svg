<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="100%" height="100%">
  <rect width="320" height="100" fill="transparent"/>
  <!-- QRIS Emblem / Stylized QR Symbol -->
  <g transform="translate(15, 12)">
    <!-- Red outer frame square -->
    <rect x="0" y="0" width="76" height="76" rx="14" fill="#ED1C24"/>
    <!-- White inner space -->
    <rect x="10" y="10" width="56" height="56" rx="8" fill="#FFFFFF"/>
    <!-- Red inner dot/pattern -->
    <rect x="22" y="22" width="32" height="32" rx="4" fill="#ED1C24"/>
    <!-- Center white dot -->
    <rect x="32" y="32" width="12" height="12" rx="2" fill="#FFFFFF"/>
  </g>
  <!-- Text QRIS -->
  <g transform="translate(105, 58)">
    <text font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#141418" letter-spacing="-1">QRIS</text>
  </g>
  <!-- Text Subtitle: STANDAR PEMBAYARAN NASIONAL -->
  <g transform="translate(107, 78)">
    <text font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="10.5" font-weight="800" fill="#71717A" letter-spacing="1.2">STANDAR PEMBAYARAN NASIONAL</text>
  </g>
</svg>

